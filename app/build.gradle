// -----------------------------------------------------------------------------
// Versioning
// -----------------------------------------------------------------------------

def versionCodeFile = rootProject.file('version-code.txt')

def readVersionCode = {
    if (!versionCodeFile.isFile()) {
        throw new GradleException("Version code file not found: ${versionCodeFile}")
    }

    def text = versionCodeFile.text.trim()

    if (!(text ==~ /\d+/)) {
        throw new GradleException("Version code in ${versionCodeFile} must be a positive integer")
    }

    try {
        text.toInteger()
    } catch (NumberFormatException exception) {
        throw new GradleException("Version code in ${versionCodeFile} is too large", exception)
    }
}

def configuredVersionCode = readVersionCode()

// -----------------------------------------------------------------------------
// Android
// -----------------------------------------------------------------------------

android {
    namespace = 'com.better.nothing.music.vizualizer'
    compileSdk = 37

    defaultConfig {
        applicationId = 'com.better.nothing.music.vizualizer'
        minSdk = 26
        targetSdk = 37
        versionCode = configuredVersionCode
        versionName = '4.3'

        resourceConfigurations += [
                'en', 'ar', 'cy', 'de', 'es', 'fr', 'hi',
                'hu', 'it', 'ja', 'ru', 'sk', 'tr', 'zh-rCN', 'b+zh+Hant'
        ]

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }

        debug {
            debuggable = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            applicationIdSuffix = '.debug'
            versionNameSuffix = '.debug'
        }
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlin {
        compilerOptions {
            jvmTarget.set(JvmTarget.JVM_17)
        }
    }

    packaging {
        resources {
            excludes += [
                    'META-INF/*.version',
                    'META-INF/*.txt',
                    'META-INF/licenses/**',
                    'META-INF/AL2.0',
                    'META-INF/LGPL2.1',
                    'META-INF/LICENSE*',
                    'META-INF/NOTICE*',
                    'META-INF/DEPENDENCIES',
                    'META-INF/*.kotlin_module',
                    'META-INF/androidx/**/LICENSE.txt',
                    '**/kotlin-tooling-metadata.json',
                    '**/*.proto',
                    'DebugProbesKt.bin',
                    'LICENSE*.txt',
                    'kotlin/**/*.kotlin_builtins'
            ]
        }
    }
}

// -----------------------------------------------------------------------------
// Release version code
// -----------------------------------------------------------------------------

def bumpReleaseVersionCode = tasks.register('bumpReleaseVersionCode') {
    onlyIf {
        ['assembleRelease', 'bundleRelease'].any { taskName ->
            def task = tasks.findByName(taskName)
            task != null && task.state.executed && task.state.failure == null
        }
    }

    doLast {
        def currentVersionCode = readVersionCode()

        if (currentVersionCode != configuredVersionCode) {
            throw new GradleException(
                    "Version code changed during release build " +
                            "(expected ${configuredVersionCode}, found ${currentVersionCode})"
            )
        }

        versionCodeFile.text = "${currentVersionCode + 1}\n"
        logger.lifecycle("Next release version code: ${currentVersionCode + 1}")
    }
}

// -----------------------------------------------------------------------------
// Root module configuration
// -----------------------------------------------------------------------------

def moduleId = { String variant ->
    def suffix = android.buildTypes.getByName(variant).applicationIdSuffix ?: ''
    "${android.defaultConfig.applicationId}${suffix}"
}

def moduleVersionName = { String variant ->
    def suffix = android.buildTypes.getByName(variant).versionNameSuffix ?: ''
    "${android.defaultConfig.versionName}${suffix}"
}

def moduleVersionCode = {
    configuredVersionCode
}

def moduleDisplayName = 'Better Nothing Music Visualizer'
def moduleAuthor = 'RedTTG'

// -----------------------------------------------------------------------------
// Generated module files
// -----------------------------------------------------------------------------

def writeModuleProp = { File moduleDir, String variant ->
    def appId = moduleId(variant)

    def contents = [
            "id=${appId}",
            "name=${moduleDisplayName}",
            "version=${moduleVersionName(variant)}",
            "versionCode=${moduleVersionCode()}",
            "author=${moduleAuthor}",
            "description=Privileged audio capture for ${appId}"
    ].join('\n') + '\n'

    new File(moduleDir, 'module.prop').text = contents
}

def writePermissionsXml = { File moduleDir, String variant ->
    def appId = moduleId(variant)

    def permissionsDir = new File(moduleDir, 'system/etc/permissions')
    permissionsDir.mkdirs()

    def contents = """\
<?xml version="1.0" encoding="utf-8"?>
<permissions>
    <privapp-permissions package="${appId}">
        <permission name="android.permission.CAPTURE_AUDIO_OUTPUT" />
        <permission name="android.permission.MODIFY_AUDIO_ROUTING" />
    </privapp-permissions>
</permissions>
"""

    new File(
            permissionsDir,
            "privapp-permissions-${appId}.xml"
    ).text = contents
}

def copyModuleApk = { File moduleDir, File apk, String variant ->
    def appId = moduleId(variant)

    def appDir = new File(moduleDir, "system/priv-app/${appId}")
    appDir.mkdirs()

    copy {
        from apk
        into appDir
        rename { 'BNMV.apk' }
    }
}

// -----------------------------------------------------------------------------
// Module assembly
// -----------------------------------------------------------------------------

def registerRootModule = { String variant ->
    def capitalized = variant.capitalize()
    def appId = moduleId(variant)

    def apkFile = layout.buildDirectory.file(
            "outputs/apk/${variant}/app-${variant}.apk"
    )

    def moduleDir = layout.buildDirectory.dir(
            "root-module/${variant}"
    )

    def outputDir = layout.buildDirectory.dir(
            "outputs/root-module"
    )

    def zipFileName = "better-nothing-music-visualizer-${variant}.zip"

    def prepareTask = tasks.register("prepareRootModule${capitalized}") {
        dependsOn("assemble${capitalized}")

        inputs.file(apkFile)
        inputs.property('applicationId', appId)
        inputs.property('versionCode', moduleVersionCode())
        inputs.property('versionName', moduleVersionName(variant))

        outputs.dir(moduleDir)

        doLast {
            def apk = apkFile.get().asFile

            if (!apk.isFile()) {
                throw new GradleException("APK not found: ${apk}")
            }

            def root = moduleDir.get().asFile

            delete(root)
            root.mkdirs()

            writeModuleProp(root, variant)
            writePermissionsXml(root, variant)
            copyModuleApk(root, apk, variant)

            logger.lifecycle("Prepared ${variant} root module: ${root}")
        }
    }

    tasks.register("buildRootModule${capitalized}", Zip) {
        dependsOn(prepareTask)

        archiveFileName.set(zipFileName)
        destinationDirectory.set(outputDir)

        from(moduleDir)

        // BCR-style reproducible ZIP.
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
}

// -----------------------------------------------------------------------------
// ADB
// -----------------------------------------------------------------------------

abstract class AdbOperations {
    @Inject
    abstract ExecOperations getExecOperations()

    void run(List<String> args) {
        execOperations.exec {
            commandLine args
        }
    }
}

def adb = objects.newInstance(AdbOperations)

def registerRootModuleInstall = { String variant ->
    def capitalized = variant.capitalize()
    def zipName = "better-nothing-music-visualizer-${variant}.zip"

    tasks.register("installRootModule${capitalized}") {
        dependsOn("buildRootModule${capitalized}")

        doLast {
            def zipFile = layout.buildDirectory.file(
                    "outputs/root-module/${zipName}"
            ).get().asFile

            if (!zipFile.isFile()) {
                throw new GradleException("Root module ZIP not found: ${zipFile}")
            }

            def remotePath = "/data/local/tmp/${zipName}"

            adb.run([
                    'adb', 'push',
                    zipFile.absolutePath,
                    remotePath
            ])

            adb.run([
                    'adb', 'shell', 'su', '-c',
                    "ksud module install ${remotePath}"
            ])

            logger.lifecycle(
                    "Root module installed. Reboot required to activate it."
            )
        }
    }
}

// -----------------------------------------------------------------------------
// Register variant tasks
// -----------------------------------------------------------------------------

['debug', 'release'].each { variant ->
    registerRootModule(variant)
    registerRootModuleInstall(variant)
}

tasks.register('buildRootModule') {
    def variant = providers.gradleProperty('variant').orElse('debug')

    doFirst {
        if (!(variant.get() in ['debug', 'release'])) {
            throw new GradleException("Use -Pvariant=debug or -Pvariant=release")
        }
    }

    dependsOn(variant.map {
        "buildRootModule${it.capitalize()}"
    })
}

tasks.register('installRootModule') {
    def variant = providers.gradleProperty('variant').orElse('debug')

    doFirst {
        if (!(variant.get() in ['debug', 'release'])) {
            throw new GradleException("Use -Pvariant=debug or -Pvariant=release")
        }
    }

    dependsOn(variant.map {
        "installRootModule${it.capitalize()}"
    })
}

tasks.configureEach {
    if (name in ['assembleRelease', 'bundleRelease']) {
        finalizedBy(bumpReleaseVersionCode)
    }
}

