    @media (prefers-reduced-motion: no-preference) {
      rect { animation: eq 1.2s ease-in-out infinite; }
      rect:nth-of-type(2) { animation-duration: .9s;  animation-delay: -.3s; }
      rect:nth-of-type(3) { animation-duration: 1.4s; animation-delay: -.6s; }
